<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chú Pô FF – Link Bio</title>
  <style>
    /* ========== RESET & CƠ BẢN ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      background: #000;
      /* Hỗ trợ safe-area iPhone (notch) */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ========== VIDEO NỀN ========== */
    #bg-video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Lớp phủ tối nhẹ lên video */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    /* ========== MÀN HÌNH CHỜ (SPLASH) ========== */
    #splash {
      position: fixed; inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash span {
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.85);
      animation: blink 1.4s ease-in-out infinite;
      user-select: none;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    /* ========== NỘI DUNG CHÍNH ========== */
    #main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 16px 100px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.9s ease 0.2s, transform 0.9s ease 0.2s;
    }
    #main.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== CARD KÍNH MỜ (GLASSMORPHISM) ========== */
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========== AVATAR ========== */
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.85);
      object-fit: cover;
      box-shadow: 0 0 20px rgba(255,255,255,0.25);
    }

    /* ========== TÊN & MÔ TẢ ========== */
    .display-name {
      margin-top: 14px;
      font-size: 1.45rem;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255,255,255,0.3);
    }
    .bio {
      margin-top: 6px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.55);
      text-align: center;
      line-height: 1.5;
      max-width: 340px;
      word-break: break-word;
    }

    /* ========== HÀNG ICON XÃ HỘI NHỎ ========== */
    .social-row {
      display: flex;
      gap: 14px;
      margin-top: 18px;
    }
    .social-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      cursor: pointer;
      text-decoration: none;
    }
    .social-icon:hover, .social-icon:active {
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 4px 18px rgba(255,255,255,0.18);
      filter: brightness(1.25);
    }
    .social-icon svg {
      width: 20px; height: 20px;
      fill: #fff;
    }

    /* ========== PHẦN CÁC NÚT LINK ========== */
    .links-section {
      width: 100%;
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Nhãn nhóm */
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
      margin-bottom: 2px;
      padding-left: 4px;
    }

    /* Nút link */
    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      text-decoration: none;
      color: #fff;
      font-size: 0.92rem;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .link-btn:hover, .link-btn:active {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.13);
      box-shadow: 0 4px 16px rgba(255,255,255,0.08);
    }
    .link-btn .icon-box {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .link-btn .icon-box svg {
      width: 20px; height: 20px;
      fill: #fff;
    }
    .link-btn .label {
      flex: 1;
      font-weight: 500;
    }
    .link-btn .arrow {
      font-size: 1.3rem;
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ========== THANH ĐIỀU KHIỂN NHẠC ========== */
    #music-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.08);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #music-bar.visible { opacity: 1; }

    #btn-play {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    #btn-play:hover { background: rgba(255,255,255,0.22); }

    #volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    #volume-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
    }

    .vol-icon {
      width: 18px; height: 18px;
      fill: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      #main { padding: 32px 10px 110px; }
      .card { padding: 28px 16px 24px; border-radius: 20px; }

      .link-btn { padding: 11px 12px; font-size: 0.85rem; }

  <!-- Audio ẩn (tên file có tiếng Việt – dùng encodeURI) -->

  <script>
    /* ===== Khởi tạo audio (encodeURI cho tên file có dấu) ===== */
    const audio = document.getElementById('bg-music');
    audio.src = encodeURI('fishy - VẾT THƯƠNG - OFFICIAL MUSIC VIDEO_320k.mp3');
    audio.volume = 0.6;

    const splash   = document.getElementById('splash');
    const main     = document.getElementById('main');
    const musicBar = document.getElementById('music-bar');
    const btnPlay  = document.getElementById('btn-play');
    const volSlider = document.getElementById('volume-slider');

    let entered = false;

    /* ===== Bấm vào splash → vào trang, phát nhạc ===== */
    splash.addEventListener('click', () => {
      if (entered) return;
      entered = true;

      // Ẩn splash
      splash.classList.add('hidden');

      // Hiện nội dung chính (fade + trượt lên)
      setTimeout(() => {
        main.classList.add('visible');
        musicBar.classList.add('visible');
      }, 150);

      // Phát nhạc (cần gesture của người dùng)
      audio.play().then(() => {
        btnPlay.textContent = '⏸';
      }).catch(() => {
        // Nếu trình duyệt vẫn chặn, người dùng bấm nút play thủ công
        btnPlay.textContent = '▶';
      });
    });

    /* ===== Nút phát / tạm dừng ===== */
    btnPlay.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btnPlay.textContent = '⏸';
      } else {
        audio.pause();
        btnPlay.textContent = '▶';
      }
    });

    /* ===== Thanh chỉnh âm lượng ===== */
    volSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value / 100;
    });
  </script>
